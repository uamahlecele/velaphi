    <!-- Background image with slow push-in animation -->
    <div class="bg-hero" id="bgHero" aria-hidden="true"></div>
    <script>
        (function () {
            const bg = document.getElementById('bgHero');
            if (!bg) return;
            const img = new Image();
            img.src = '/images/16v.png';
            function trigger() {
                if (!bg.classList.contains('loaded')) {
                    bg.classList.add('loaded');
                }
            }
            if (img.complete) {
                trigger();
            } else {
                img.addEventListener('load', trigger);
                img.addEventListener('error', trigger);
                setTimeout(trigger, 2500);
            }
        })();
    </script>
