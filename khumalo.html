<!-- Loading my json file with all the data of izithakazelo, the history and the famous people associated with that surname.-->

<script>

     async function main(){

            famousUl.innerHTML= `<ul>${surnamez.famous_people}</ul>`

           }
            else{
                continue
            }t
            
        }
     }

   async function getData(){
